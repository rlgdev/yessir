name: release

# Two ways to cut a release:
#   1. push a tag v* by hand, or
#   2. bump VERSION on main — the job creates the tag itself and releases.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["VERSION"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.out.outputs.released }}
      version: ${{ steps.out.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag from VERSION (when triggered by a branch push)
        id: tag
        if: github.ref_type == 'branch'
        run: |
          set -euo pipefail
          v="v$(tr -d ' \r\n' < VERSION)"
          if git ls-remote --tags origin "refs/tags/$v" | grep -q .; then
            echo "tag $v already exists; nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$v" -m "$v"
          git push origin "$v"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.tag.outputs.skip != 'true'
        with:
          go-version: "1.24"

      - uses: goreleaser/goreleaser-action@v6
        if: steps.tag.outputs.skip != 'true'
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag || github.ref_name }}

      - name: Outputs for the npm job
        id: out
        if: always()
        run: |
          tag="${{ steps.tag.outputs.tag || github.ref_name }}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.tag.outputs.skip }}" = "true" ]; then echo "released=false"; else echo "released=true"; fi >> "$GITHUB_OUTPUT"

  npm:
    needs: goreleaser
    if: needs.goreleaser.outputs.released == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/npm.yml
    with:
      version: ${{ needs.goreleaser.outputs.version }}
    secrets: inherit
