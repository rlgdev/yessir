name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: go vet ./...
      - run: go test ./... -count=1
      - run: go build -o yessir${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/yessir
      - name: smoke — hook answers a sample payload
        shell: bash
        env:
          YESSIR_HOME: ${{ runner.temp }}/yessir-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/claude-home
        run: |
          set -euo pipefail
          exe=./yessir; [ "$RUNNER_OS" = Windows ] && exe=./yessir.exe
          $exe version
          $exe on --global
          out=$(sed "s#/home/me/work/repo#$PWD#" testdata/permission-request/bash.json | $exe hook)
          echo "$out"
          echo "$out" | grep -q '"behavior":"allow"'
          out=$(sed "s#/home/me/work/repo#$PWD#" testdata/permission-request/force-push.json | $exe hook)
          [ -z "$out" ]
          $exe status
          $exe uninstall

  install-from-source:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: run scripts/install-from-source.ps1 like a user would (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -ExecutionPolicy Bypass -File .\scripts\install-from-source.ps1 -Dest "$env:RUNNER_TEMP\ybin" -NoPath
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$env:RUNNER_TEMP\ybin\yessir.exe" version

  install-with-go:
    # Simulates a locked-down laptop: no Go on PATH is used (forced download),
    # and the script is run the way a user pastes it, as a scriptblock.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: paste-style run of scripts/install-with-go.ps1 (Windows PowerShell 5.1)
        shell: powershell
        env:
          YESSIR_FORCE_GO_DOWNLOAD: "1"
        run: |
          $dest = "$env:RUNNER_TEMP\ybin"
          $code = (Get-Content -Raw .\scripts\install-with-go.ps1) -replace '(?m)^\$dest\s*=.*$', "`$dest = '$dest'"
          & ([scriptblock]::Create($code))
          & "$dest\yessir.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path "$env:USERPROFILE\.yessir\go") { Write-Error 'temporary Go was not removed'; exit 1 }

  npm-package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: build, pack, unpack and run the npm launcher
        shell: bash
        run: scripts/npm-smoke.sh

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
